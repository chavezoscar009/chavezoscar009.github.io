<header id="header">
	<h1 id="logo"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>

	<nav id="nav">
		<ul>
			{% for item in site.data.nav %}
			{% assign is_active = false %}
			{% if item.url == '/' %}
				{% if page.url == '/' %}{% assign is_active = true %}{% endif %}
			{% elsif page.url contains item.url %}
				{% assign is_active = true %}
			{% endif %}
			<li{% if is_active %} class="active"{% endif %}><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
			{% endfor %}
		</ul>
	</nav>

	<a href="{{ '/cv-resume/' | relative_url }}" id="utility-link">CV / Résumé</a>

	<button type="button" id="nav-toggle" aria-expanded="false" aria-controls="nav">
		<span class="bar"></span>
		<span class="visually-hidden">Menu</span>
	</button>
</header>
